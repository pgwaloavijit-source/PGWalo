             L218 108
             C239 87 273 87 294 108
             L430 244
             C441 255 444 271 436 284
             C430 294 420 300 408 300
             C399 300 391 297 384 290
             L256 162
             L128 290
             C121 297 113 300 104 300 Z"/>
    <!-- Four-pane window -->
    <rect x="222" y="238" width="30" height="30" rx="7"/>
    <rect x="260" y="238" width="30" height="30" rx="7"/>
    <rect x="222" y="276" width="30" height="30" rx="7"/>
    <rect x="260" y="276" width="30" height="30" rx="7"/>
